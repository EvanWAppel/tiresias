name: CI

# Hermetic: the suite builds a synthetic city warehouse in a temp dir, so CI needs
# no real warehouse, no network for data, and no API key. The `slow` tests (real
# fastembed model download) are left to local runs.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ruff, ty, pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: ruff check
        run: uv run ruff check tiresias tests
      - name: ruff format
        run: uv run ruff format --check tiresias tests
      - name: ty
        run: uv run ty check tiresias tests
      - name: pytest
        run: uv run pytest -q -m "not slow"
