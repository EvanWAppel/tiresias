# Retrieval-quality gold set — does hybrid retrieval fetch the right grounding?
#
# For each query, at least one of `expect_any` (a table or metric ref) must appear
# among the top-k retrieved docs. Scored as recall@k. This exercises the RAG layer
# on its own — no LLM — so a retrieval regression is caught deterministically.
version: 1
k: 3
min_recall: 0.85
cases:
  - query: Which restaurants fail inspection most often?
    expect_any: [mart_restaurants, restaurant_failure_rate]
  - query: What are the most common health code violations?
    expect_any: [mart_top_violations, top_violation_frequency]
  - query: How have inspection counts changed over time?
    expect_any: [mart_inspections_over_time]
  - query: What specific violations did a restaurant receive?
    expect_any: [mart_inspection_violations]
  - query: What is the inspection compliance rate for restaurants?
    expect_any: [mart_restaurants, restaurant_compliance_rate]
  - query: What are the average demerits per restaurant?
    expect_any: [mart_restaurants, restaurant_avg_demerits]
  - query: How many restaurants have had closures?
    expect_any: [mart_restaurants]
  - query: Which violation codes carry the most demerits?
    expect_any: [mart_top_violations]
  # --- all-domains expansion ---
  - query: How many police calls were there each month?
    expect_any: [mart_crime_monthly]
  - query: What are the most common types of police calls?
    expect_any: [mart_crime_by_type]
  - query: Which hour of the day has the most calls for service?
    expect_any: [mart_crime_by_hour_weekday]
  - query: How many building permits were issued per month?
    expect_any: [mart_permits_monthly, mart_henderson_permits]
  - query: How many visitors came to Las Vegas?
    expect_any: [mart_lvcva_indicators]
  - query: How many days over 110 degrees were there each year?
    expect_any: [mart_weather_extreme_days]
  - query: Which month had the worst air quality?
    expect_any: [mart_air_quality_monthly, mart_air_quality_daily]
  - query: How low has Lake Mead's elevation gotten?
    expect_any: [mart_lake_mead_monthly]
  - query: Which state do most couples marrying in Vegas come from?
    expect_any: [mart_marriage_by_origin]
  - query: How many short-term rentals are in Henderson?
    expect_any: [mart_short_term_rentals]
  - query: Which roads are fully closed for construction?
    expect_any: [mart_road_construction]
  - query: Which properties have the most fire code violations?
    expect_any: [mart_fire_prevention_inspections]
  - query: Which census tract has the most police calls per 1,000 residents?
    expect_any: [mart_tract_metrics]
